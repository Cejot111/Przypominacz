name: Build Android APK (KardioMed)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build APK (Release & Debug)
        run: |
          set -o pipefail
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew 2>/dev/null || true
          gradle assembleRelease --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Utworz zgloszenie z logiem bledu
        if: failure()
        run: |
          grep -E "(e: |Compilation error|Unresolved)" gradle_output.txt | head -n 40 > error_summary.txt
          gh issue create --title "Kotlin Compiler Errors" --body-file error_summary.txt || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Znajdz wygenerowany plik APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          echo "Znaleziony APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Udostepnij APK jako Artifact w GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KardioMed-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Utworz GitHub Release z plikiem APK
        uses: softprops/action-gh-release@v1
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: KardioMed v1.0.0 - Pobierz aplikacje na Androida
          body: |
            ### KardioMed - Notatnik, Pomiary Ciśnienia i Głośne Alarmy
            - Głośne alarmy budzika (zwykłe i cykliczne) z wyborem dźwięku i wibracjami
            - Notatnik z inteligentną tabelą ciśnień (autouzupełnianie schematu Rano / Wieczór)
            - Check-lista zakupów aptecznych i notatki tekstowe
            - Eksport i udostępnianie raportu do lekarza
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
